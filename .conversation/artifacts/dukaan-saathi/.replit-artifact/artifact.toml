kind = "mobile"
previewPath = "/"
title = "Dukaan Saathi"
description = "A neighborhood shopping app where customers discover local shops, merchants manage inventory and pickup orders, and admins oversee the marketplace."
version = "1.0.0"
id = "artifacts/dukaan-saathi"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21779

[services.development]
run = "pnpm --filter @workspace/dukaan-saathi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dukaan-saathi", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/dukaan-saathi", "run", "serve" ]

[services.env]
PORT = "21779"
BASE_PATH = "/"
