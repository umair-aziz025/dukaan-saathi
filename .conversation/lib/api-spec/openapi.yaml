openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Dukaan Saathi mobile application API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dukaan
    description: Customer and merchant application operations
  - name: admin
    description: Privileged shop and audit operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dukaan/me:
    get:
      operationId: getDukaanProfile
      tags: [dukaan]
      summary: Get the authenticated user's application profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
  /dukaan/onboard:
    post:
      operationId: createDukaanProfile
      tags: [dukaan]
      summary: Create the application profile after verified sign-up
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardRequest"
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
  /dukaan/profile-change-requests:
    get:
      operationId: getDukaanProfileChangeRequests
      tags: [dukaan]
      summary: List the authenticated customer's or merchant's profile change requests
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Profile change request history for the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileChangeRequestsResponse"
    post:
      operationId: createDukaanProfileChangeRequest
      tags: [dukaan]
      summary: Submit a name or phone change request for admin review
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileChangeRequest"
      responses:
        "201":
          description: Request created; the current profile remains unchanged until approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileChangeRequestResponse"
        "409":
          description: A request for this field is already pending
  /dukaan/admin/profile-change-requests:
    get:
      operationId: getDukaanAdminProfileChangeRequests
      tags: [admin]
      summary: List profile change requests for administrator review
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        "200":
          description: Admin-only profile change request queue or history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileChangeRequestsResponse"
  /dukaan/admin/profile-change-requests/{requestId}:
    patch:
      operationId: reviewDukaanProfileChangeRequest
      tags: [admin]
      summary: Approve or reject a pending profile change request
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewProfileChangeRequest"
      responses:
        "200":
          description: Review recorded with administrator identity and timestamp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileChangeRequestResponse"
        "403":
          description: Administrator access required
        "404":
          description: Profile change request not found
        "409":
          description: Request has already been reviewed or its current value changed
  /dukaan/shops/mine:
    get:
      operationId: getDukaanMerchantShop
      tags: [dukaan]
      summary: Get the authenticated merchant's shop details
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The merchant's own shop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"
        "403":
          description: Merchant access required
        "404":
          description: No shop is registered
    patch:
      operationId: updateDukaanMerchantShop
      tags: [dukaan]
      summary: Update the authenticated merchant's shop name, address, and location
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShopDetailsRequest"
      responses:
        "200":
          description: Updated shop details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"
        "403":
          description: Merchant access required
        "404":
          description: No shop is registered
  /dukaan/shops:
    post:
      operationId: createDukaanShop
      tags: [dukaan]
      summary: Register a shop owned by the current merchant
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopRequest"
      responses:
        "201":
          description: Shop submitted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"
  /dukaan/catalog:
    get:
      operationId: getDukaanCatalog
      tags: [dukaan]
      summary: Find approved nearby shops and active inventory
      parameters:
        - in: query
          name: latitude
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - in: query
          name: longitude
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - in: query
          name: radiusKm
          required: false
          schema: { type: number, minimum: 0.1, maximum: 50, default: 8 }
      responses:
        "200":
          description: Public catalogue; excludes private owner information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
  /dukaan/orders:
    get:
      operationId: getDukaanOrders
      tags: [dukaan]
      summary: Get orders visible to the authenticated customer or merchant
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Role-filtered orders
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
    post:
      operationId: createDukaanOrder
      tags: [dukaan]
      summary: Create a single-shop pickup order after customer confirmation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Confirmed order with its stable six-digit pickup code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
  /dukaan/push-tokens:
    post:
      operationId: registerDukaanPushToken
      tags: [dukaan]
      summary: Register an Expo push token for the authenticated customer or merchant
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenRegistrationRequest"
      responses:
        "200":
          description: Registered token identifier for this device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTokenRegistrationResponse"
  /dukaan/push-tokens/{tokenId}:
    delete:
      operationId: unregisterDukaanPushToken
      tags: [dukaan]
      summary: Remove a push token owned by the authenticated customer or merchant
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: tokenId
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200":
          description: Whether the token was removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTokenRemovalResponse"
  /dukaan/notifications:
    get:
      operationId: getDukaanOrderNotifications
      tags: [dukaan]
      summary: Get in-app order notifications for the authenticated customer or merchant
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Notifications and unread count for the authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatusNotificationListResponse"
  /dukaan/notifications/read-all:
    patch:
      operationId: markAllDukaanOrderNotificationsRead
      tags: [dukaan]
      summary: Mark all of the authenticated customer's or merchant's notifications as read
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Number of notifications marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkAllOrderStatusNotificationsReadResponse"
  /dukaan/notifications/{notificationId}/read:
    patch:
      operationId: markDukaanOrderNotificationRead
      tags: [dukaan]
      summary: Mark one of the authenticated customer's or merchant's notifications as read
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: notificationId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatusNotificationResponse"
  /dukaan/orders/{orderId}/pickup-code:
    post:
      operationId: getDukaanPickupCode
      tags: [dukaan]
      summary: Retrieve the stable pickup code for the current customer's order
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The same six-digit code for this order, returned without changing it
          content:
            application/json:
              schema:
                type: object
                required: [pickupCode]
                properties:
                  pickupCode: { type: string, pattern: "^[0-9]{6}$" }
  /dukaan/orders/{orderId}/status:
    patch:
      operationId: updateDukaanOrderStatus
      tags: [dukaan]
      summary: Advance a shop-owned order through its pickup lifecycle
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [accepted, ready, completed, cancelled]
                pickupCode:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /dukaan/products:
    get:
      operationId: getMerchantProducts
      tags: [dukaan]
      summary: Get products belonging to the authenticated merchant
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Merchant's inventory
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: createMerchantProduct
      tags: [dukaan]
      summary: Add a product to the merchant's approved shop
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /dukaan/products/{productId}:
    patch:
      operationId: updateMerchantProduct
      tags: [dukaan]
      summary: Update a product owned by the authenticated merchant
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteMerchantProduct
      tags: [dukaan]
      summary: Deactivate a product owned by the authenticated merchant
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product deactivated
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
  /dukaan/assistant:
    post:
      operationId: askDukaanAssistant
      tags: [dukaan]
      summary: Parse a grocery request and return nearby product suggestions
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantRequest"
      responses:
        "200":
          description: Suggestions requiring customer confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantResponse"
  /dukaan/merchant-assistant:
    post:
      operationId: askMerchantAssistant
      tags: [dukaan]
      summary: Parse a merchant instruction into a proposed inventory change
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties:
                instruction: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: Preview only; merchant must confirm before saving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantAssistantResponse"
  /dukaan/transcribe:
    post:
      operationId: transcribeDukaanAudio
      tags: [dukaan]
      summary: Transcribe a short Urdu, Roman Urdu, or English voice note
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audioBase64, mimeType]
              properties:
                audioBase64: { type: string, maxLength: 7000000 }
                mimeType: { type: string, enum: [audio/mp4, audio/m4a, audio/webm, audio/wav] }
      responses:
        "200":
          description: Transcript for the user to review before sending
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string }
  /dukaan/admin/overview:
    get:
      operationId: getDukaanAdminOverview
      tags: [admin]
      summary: Get high-level counts and recent non-sensitive audit events
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Admin-only system overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
  /dukaan/admin/orders:
    get:
      operationId: getDukaanAdminOrders
      tags: [admin]
      summary: Filter orders and calculate metrics for an authorized administrator
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: startDate
          schema: { type: string, format: date }
        - in: query
          name: endDate
          schema: { type: string, format: date }
        - in: query
          name: shopId
          schema: { type: string }
        - in: query
          name: productName
          schema: { type: string, maxLength: 100 }
        - in: query
          name: status
          schema: { type: string, enum: [pending, accepted, ready, completed, cancelled] }
        - in: query
          name: minAmount
          schema: { type: number, minimum: 0 }
        - in: query
          name: maxAmount
          schema: { type: number, minimum: 0 }
      responses:
        "200":
          description: Filtered order page and aggregates over all matching orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrdersResponse"
  /dukaan/admin/users:
    get:
      operationId: getDukaanAdminUsers
      tags: [admin]
      summary: Search customer and merchant accounts for an authorized administrator
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
        - in: query
          name: offset
          description: Number of matching accounts to skip; each response includes at most 100 accounts.
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        "200":
          description: Page of matching customer and merchant accounts with a total count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"
  /dukaan/admin/shops/{shopId}:
    patch:
      operationId: reviewDukaanShop
      tags: [admin]
      summary: Approve or reject a merchant shop application
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: shopId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, rejected] }
      responses:
        "200":
          description: Shop review result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Profile:
      type: object
      required: [id, name, email, phone, role, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        role: { type: string, enum: [customer, merchant, admin] }
        shopStatus: { type: [string, "null"], enum: [pending, approved, rejected, null] }
        createdAt: { type: string, format: date-time }
    ProfileResponse:
      type: object
      required: [profile]
      properties:
        profile: { $ref: "#/components/schemas/Profile" }
    ProfileChangeRequest:
      type: object
      required:
        [id, userId, userName, userEmail, userRole, field, currentValue, requestedValue, status, createdAt, reviewedBy, reviewerName, reviewedAt, rejectionReason]
      properties:
        id: { type: string }
        userId: { type: string }
        userName: { type: string }
        userEmail: { type: string, format: email }
        userRole: { type: string, enum: [customer, merchant] }
        field: { type: string, enum: [name, phone] }
        currentValue: { type: string }
        requestedValue: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        createdAt: { type: string, format: date-time }
        reviewedBy: { type: [string, "null"] }
        reviewerName: { type: [string, "null"] }
        reviewedAt: { type: [string, "null"], format: date-time }
        rejectionReason: { type: [string, "null"], maxLength: 300 }
    ProfileChangeRequestsResponse:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items: { $ref: "#/components/schemas/ProfileChangeRequest" }
    ProfileChangeRequestResponse:
      type: object
      required: [request]
      properties:
        request: { $ref: "#/components/schemas/ProfileChangeRequest" }
    CreateProfileChangeRequest:
      type: object
      required: [field, requestedValue]
      properties:
        field: { type: string, enum: [name, phone] }
        requestedValue: { type: string, minLength: 2, maxLength: 80 }
    ReviewProfileChangeRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [approved, rejected] }
        rejectionReason: { type: string, maxLength: 300 }
    OnboardRequest:
      type: object
      required: [name, email, phone, cnic, role]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, minLength: 10, maxLength: 20 }
        cnic: { type: string, pattern: "^[0-9]{5}-?[0-9]{7}-?[0-9]$" }
        role: { type: string, enum: [customer, merchant] }
    Shop:
      type: object
      required: [id, name, address, contact, latitude, longitude, status, isDemo]
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string }
        contact: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        status: { type: string, enum: [pending, approved, rejected] }
        isDemo: { type: boolean }
    ShopRequest:
      type: object
      required: [name, address, contact, latitude, longitude]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        address: { type: string, minLength: 5, maxLength: 240 }
        contact: { type: string, minLength: 10, maxLength: 20 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    UpdateShopDetailsRequest:
      type: object
      required: [name, address, latitude, longitude]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        address: { type: string, minLength: 5, maxLength: 240 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    Product:
      type: object
      required: [id, shopId, name, category, unit, price, stock, active]
      properties:
        id: { type: string }
        shopId: { type: string }
        name: { type: string }
        category: { type: string }
        unit: { type: string }
        price: { type: integer, minimum: 1 }
        stock: { type: integer, minimum: 0 }
        active: { type: boolean }
    ProductRequest:
      type: object
      required: [name, category, unit, price, stock]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        category: { type: string, minLength: 2, maxLength: 40 }
        unit: { type: string, minLength: 1, maxLength: 30 }
        price: { type: integer, minimum: 1, maximum: 1000000 }
        stock: { type: integer, minimum: 0, maximum: 100000 }
    CatalogResponse:
      type: object
      required: [shops, products]
      properties:
        shops:
          type: array
          items: { $ref: "#/components/schemas/Shop" }
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
    OrderLine:
      type: object
      required: [productId, name, unit, quantity, price, lineTotal]
      properties:
        productId: { type: string }
        name: { type: string }
        unit: { type: string }
        quantity: { type: integer }
        price: { type: integer }
        lineTotal: { type: integer }
    Order:
      type: object
      required: [id, shopId, shopName, shopAddress, shopLatitude, shopLongitude, items, total, status, paymentMethod, paymentStatus, createdAt]
      properties:
        id: { type: string }
        shopId: { type: string }
        shopName: { type: string }
        shopAddress: { type: string }
        shopLatitude: { type: [number, "null"] }
        shopLongitude: { type: [number, "null"] }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        total: { type: integer }
        status: { type: string }
        paymentMethod: { type: string }
        paymentStatus: { type: string }
        createdAt: { type: string, format: date-time }
    PushTokenRegistrationRequest:
      type: object
      required: [token, platform]
      properties:
        token: { type: string, minLength: 20, maxLength: 255 }
        platform: { type: string, enum: [ios, android] }
    PushTokenRegistrationResponse:
      type: object
      required: [registered, tokenId]
      properties:
        registered: { type: boolean }
        tokenId: { type: string, pattern: "^[a-f0-9]{64}$" }
    PushTokenRemovalResponse:
      type: object
      required: [removed]
      properties:
        removed: { type: boolean }
    OrderStatusNotification:
      type: object
      required: [id, orderId, shopId, shopName, status, previousStatus, isRead, createdAt]
      properties:
        id: { type: string }
        orderId: { type: string }
        shopId: { type: string }
        shopName: { type: string }
        status: { type: string, enum: [pending, accepted, ready, completed] }
        previousStatus:
          type: [string, "null"]
          enum: [pending, accepted, ready, completed, null]
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
    OrderStatusNotificationListResponse:
      type: object
      required: [notifications, unreadCount]
      properties:
        notifications:
          type: array
          items: { $ref: "#/components/schemas/OrderStatusNotification" }
        unreadCount: { type: integer, minimum: 0 }
    OrderStatusNotificationResponse:
      type: object
      required: [notification]
      properties:
        notification: { $ref: "#/components/schemas/OrderStatusNotification" }
    MarkAllOrderStatusNotificationsReadResponse:
      type: object
      required: [updatedCount]
      properties:
        updatedCount: { type: integer, minimum: 0 }
    CreateOrderRequest:
      type: object
      required: [items, idempotencyKey, paymentMethod]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string }
              quantity: { type: integer, minimum: 1, maximum: 99 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 100 }
        paymentMethod: { type: string, enum: [pay_on_pickup] }
    OrderResponse:
      type: object
      required: [order]
      properties:
        order: { $ref: "#/components/schemas/Order" }
        pickupCode:
          type: string
          pattern: "^[0-9]{6}$"
          description: Stable six-digit code for the confirmed order
    AssistantRequest:
      type: object
      required: [message, latitude, longitude]
      properties:
        message: { type: string, minLength: 1, maxLength: 1200 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        history:
          type: array
          maxItems: 6
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string, maxLength: 1200 }
    AssistantResponse:
      type: object
      required: [reply, products, needsClarification]
      properties:
        reply: { type: string }
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        needsClarification: { type: boolean }
    MerchantAssistantResponse:
      type: object
      required: [reply, action, preview]
      properties:
        reply: { type: string }
        action: { type: string, enum: [create, update, delete, clarify] }
        preview:
          type: object
          properties:
            productId: { type: string }
            name: { type: string }
            category: { type: string }
            unit: { type: string }
            price: { type: integer }
            stock: { type: integer }
    AdminOverview:
      type: object
      required: [customers, merchants, pendingShops, orders, volumePkr, recentEvents]
      properties:
        customers: { type: integer }
        merchants: { type: integer }
        pendingShops: { type: integer }
        pendingShopApplications:
          type: array
          items:
            type: object
            required: [id, name, address, contact, latitude, longitude, ownerName, ownerPhone, createdAt]
            properties:
              id: { type: string }
              name: { type: string }
              address: { type: string }
              contact: { type: string }
              latitude: { type: number }
              longitude: { type: number }
              ownerName: { type: [string, "null"] }
              ownerPhone: { type: [string, "null"] }
              createdAt: { type: string, format: date-time }
        orders: { type: integer }
        volumePkr: { type: integer }
        recentEvents:
          type: array
          items:
            type: object
            required: [action, entityType, entityId, createdAt]
            properties:
              action: { type: string }
              entityType: { type: string }
              entityId: { type: string }
              createdAt: { type: string, format: date-time }
    AdminOrdersResponse:
      type: object
      required: [orders, shops, totalCount, averageAmount]
      properties:
        orders:
          type: array
          items:
            type: object
            required: [id, shopId, shopName, productNames, total, status, createdAt]
            properties:
              id: { type: string }
              shopId: { type: string }
              shopName: { type: string }
              productNames:
                type: array
                items: { type: string }
              total: { type: number }
              status: { type: string, enum: [pending, accepted, ready, completed, cancelled] }
              createdAt: { type: string, format: date-time }
        shops:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
        totalCount: { type: integer }
        averageAmount: { type: number }
    AdminUsersResponse:
      type: object
      required: [users, totalCount]
      properties:
        users:
          type: array
          items:
            type: object
            required: [id, name, email, role, shopName, shopStatus]
            properties:
              id: { type: string }
              name: { type: string }
              email: { type: string, format: email }
              role: { type: string, enum: [customer, merchant] }
              shopName: { type: [string, "null"] }
              shopStatus: { type: [string, "null"], enum: [pending, approved, rejected, null] }
        totalCount: { type: integer }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

